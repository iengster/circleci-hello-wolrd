version: 2.1

jobs:
  hello:
    machine: true
    resource_class: phantomai-ilao/ilao-runner   # your runner pool, e.g. phantom-ai/build02-release
    steps:
      - run:
          name: Hello World
          command: echo "Hello World!"
      - run:
          name: Hostname
          command: hostname
      - run:
          name: Current user
          command: |
            whoami
            id
      - run:
          name: Kernel (uname -a)
          command: uname -a
      - run:
          name: OS (/etc/os-release)
          command: cat /etc/os-release
      - run:
          name: AWS IP Addresses
          command: |
            echo "AWS private IP: $(hostname -i)"
            echo "AWS public IP: $(curl -s https://checkip.amazonaws.com)"
      - run:
          name: Remote repo
          command: |
            echo "Repo name:   << pipeline.git.repo_name >>"
            echo "Repo URL:    << pipeline.git.repo_url >>"
            echo "Project URL: << pipeline.project.git_url >>"
            echo "Branch:      << pipeline.git.branch >>"
            echo "Commit:      << pipeline.git.revision >>"              

workflows:
  hello:
    jobs:
      - hello
